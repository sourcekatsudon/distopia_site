name: Site smoke tests
on:
  push:
    branches: [main, feature/chickenhouse-site-rebuild-20261119]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check browser scripts
        run: |
          node --check js/script.js
          node --check js/menu-data.js
          node --input-type=module --check < js/solar-system.js
      - name: Verify images, links and menu catalog
        run: node tests/smoke.cjs
